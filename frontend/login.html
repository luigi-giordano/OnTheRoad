<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accedi — OnTheRoad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="auth-shell">
    <div class="auth-form-wrap">
      <div class="auth-form">
        <a href="index.html" class="brand" style="margin-bottom: 32px;">
          <span class="brand-dot"></span> OnTheRoad
        </a>
        <h1>Bentornato.</h1>
        <p class="lead">Accedi per salvare gli itinerari e gestire i tuoi viaggi.</p>

        <form id="loginForm" class="form-stack">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-accent btn-lg btn-block">Accedi</button>
          <p id="loginError" class="field-error" style="display:none;"></p>
        </form>

        <p style="margin-top:24px;" class="muted">
          Non hai un account? <a href="registrati.html" style="color:var(--accent); font-weight:600;">Registrati gratis</a>
        </p>
      </div>
    </div>
    <div class="auth-art">
      <div class="auth-art-inner">
        <h2>"La strada non ti chiede di essere veloce. Ti chiede di esserci."</h2>
        <p>— qualcuno, da qualche parte, su un passo di montagna</p>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    // se loggato, vai al profilo
    if (Auth.current()) location.href = "profilo.html";

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const $err = document.getElementById("loginError");
      $err.style.display = "none";
      try {
        Auth.login({ email, password });
        toast("Accesso effettuato!");
        const next = new URLSearchParams(location.search).get("next") || "profilo.html";
        setTimeout(() => (location.href = next), 500);
      } catch (err) {
        $err.textContent = err.message;
        $err.style.display = "block";
      }
    });
  </script>
</body>
</html>
